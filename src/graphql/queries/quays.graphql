query getQuays(
	$quayIds: [String!]
	$filters: [EstimatedCallFilterInput!]
	$numberOfDepartures: Int = 20
	$startTime: DateTime
) {
	quays(ids: $quayIds) {
		name
		description
		publicCode
		...lines
		estimatedCalls(
			numberOfDepartures: $numberOfDepartures
			filters: $filters
			includeCancelledTrips: true
			startTime: $startTime
		) {
			...departure
		}
		situations {
			...situation
		}
		stopPlace {
      		situations {
        	...situation
      		}
    	}
	}
}
