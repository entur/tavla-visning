query StopPlace(
	$stopPlaceId: String!
	$filters: [EstimatedCallFilterInput!]
	$numberOfDepartures: Int = 20
	$startTime: DateTime
	$arrivalDeparture: ArrivalDeparture
) {
	stopPlace(id: $stopPlaceId) {
		name
		transportMode
		estimatedCalls(
			numberOfDepartures: $numberOfDepartures
			filters: $filters
			includeCancelledTrips: true
			startTime: $startTime
			arrivalDeparture: $arrivalDeparture
		) {
			...departure
		}
		situations {
			...situation
		}
		quays {
			id
			publicCode
			situations {
				...situation
			}
		}
	}
}
