query getQuay(
	$quayId: String!
	$filters: [EstimatedCallFilterInput!]
	$numberOfDepartures: Int = 20
	$startTime: DateTime
	$arrivalDeparture: ArrivalDeparture
) {
	quay(id: $quayId) {
		name
		description
		publicCode
		...lines
		estimatedCalls(
			numberOfDepartures: $numberOfDepartures
			filters: $filters
			includeCancelledTrips: true
			startTime: $startTime
			arrivalDeparture: $arrivalDeparture
		) {
			...departure
		}
		situations {
			...situation
		}
		stopPlace {
      		situations {
        	...situation
      		}
    	}
	}
}
